  #swap { position: fixed; right: 32px; bottom: 26px; z-index: 3; background: none; border: 0; color: #fff; font-size: 12px; font-weight: 500; letter-spacing: .16em; padding: 10px 0; min-height: 44px; opacity: 0; pointer-events: none; transition: opacity .5s; text-transform: uppercase; }

  #hint { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 3; font-size: 11px; font-weight: 500; letter-spacing: .2em; color: #8a8a8a; transition: opacity .5s, color .5s; white-space: nowrap; text-transform: uppercase; }

  .lbl b { display: block; font-weight: 600; font-size: 13px; letter-spacing: .16em; }
  .lbl span { font-size: 11px; color: #6b6b6b; letter-spacing: .14em; }
  #osd { position: fixed; left: 0; right: 0; top: 50%; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; padding: 0 7vw; pointer-events: none;
    font-weight: 500; font-size: clamp(11px, 1vw, 13px); letter-spacing: .2em; color: #111; transition: color .9s; text-transform: uppercase; }
  body[data-mode=split] .lbl { opacity: 1; }
  body[data-mode=split] #back, body[data-mode=focus] #back { opacity: 1; }
  
  body[data-mode=focus] #title { opacity: 0; }
  #osd > span:last-child { text-align: right; }
  
  body[data-mode=focus] #swap { opacity: 1; pointer-events: auto; }
  
  body.touched[data-mode=focus] #hint { opacity: 0; }
  body[data-mode=pair] #hint::after { content: 'Drag to rotate · Click to view'; }
  body[data-mode=split] #hint::after { content: 'Select a shoe'; }
  body[data-mode=focus] #hint::after { content: 'Drag to rotate · Swipe to switch · Click to go back'; }
  @media (max-width: 640px) { #osd { grid-template-columns: 1fr; justify-items: center; gap: 8px; top: 14%; } #osd > span:last-child { text-align: center; } .top { top: 20px; left: 20px; right: 20px; } #back { top: 20px; left: 20px; } }
  /* light pair on the page's white, dark studio for a single shoe */
  body[data-mode=focus] #back { color: #fff; }
  body[data-mode=focus] #osd { color: rgba(255,255,255,.9); }
  body[data-mode=focus] #hint { color: rgba(255,255,255,.55); }
