/* Layout: a full-screen CRT landing sits over a one-screen hero. The hero is drawn in mockup pixels (--u = one pixel of the 1512×982 frame): logo top-left, chips top-right, headline block left, signature bottom-right. */
:root{
  --red:#F80A02;
  --cream:#FFF3D8;
  --black:#000000;
  --white:#FFFFFF;
  --landing:#1E1E1E;
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --hand:"Mouse Memoirs","Arial Narrow","Helvetica Neue",sans-serif;
  --osd:"VT323",ui-monospace,Menlo,Consolas,monospace;
  --u:min(calc(100vw / 1512), calc(100vh / 982));
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--white);color:var(--black);font-family:var(--hand)}
html.intro-on body{overflow:hidden}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- landing: the TV ---------- */
.intro{display:none}
.js .intro{display:block;position:fixed;inset:0;z-index:100;background:var(--landing);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.js .intro[hidden]{display:none}
.js .intro.behind{z-index:0}
.screen{position:absolute;inset:0;transform-origin:50% 50%}
.screen.off{opacity:0}
#tv{position:absolute;inset:0;width:100%;height:100%;display:block}
.roll{position:absolute;left:0;right:0;top:0;height:30vh;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.05) 50%,rgba(255,255,255,0));transform:translateY(-35vh);animation:roll 6.5s linear infinite}
@keyframes roll{to{transform:translateY(105vh)}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0 1px,rgba(0,0,0,0) 1px 3px)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 100% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
.enter{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.enter:focus{outline:none}
.osd{position:absolute;font-family:var(--osd);color:var(--white);letter-spacing:.06em;line-height:1;white-space:nowrap;text-shadow:0 0 8px rgba(255,255,255,.45),2px 0 rgba(255,40,80,.45),-2px 0 rgba(40,200,255,.45);opacity:0;transition:opacity .2s steps(2,end)}
.osd.on{opacity:1}
.ch{top:calc(env(safe-area-inset-top,0px) + clamp(14px,3.2vh,34px));right:calc(env(safe-area-inset-right,0px) + clamp(18px,3.4vw,48px));font-size:clamp(28px,4vw,60px)}
.cue{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(16px,4.6vh,46px));transform:translateX(-50%);font-size:clamp(20px,2.3vw,32px);padding:.15em .5em}
.cue.on{animation:blink 1.2s steps(1,end) infinite}
@keyframes blink{0%,62%{opacity:1}63%,100%{opacity:.08}}
.enter:focus-visible .cue{outline:2px solid var(--white);outline-offset:4px}
.flash{position:absolute;inset:0;background:var(--white);transform:scaleY(0);pointer-events:none}

/* ---------- hero ---------- */
.site{position:relative;height:100%}
.site.front{z-index:1}
.hero{position:relative;height:100%;min-height:400px;overflow:hidden;background:var(--white)}
.mark{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,calc(24 * var(--u)));width:max(72px,calc(270 * var(--u)));margin:0;padding:0;border:0;background:none;cursor:pointer;line-height:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mark img{display:block;width:100%;height:auto}
.mark:hover{transform:rotate(-3deg) scale(1.03)}
.mark:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.nav{position:absolute;z-index:2;top:max(12px,calc(28 * var(--u)));right:max(16px,env(safe-area-inset-right,0px),calc(72 * var(--u)));display:flex;gap:calc(34 * var(--u));font-size:max(16px,calc(46 * var(--u)))}
.nav a{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:3.78em;height:1.37em;padding:0 .35em .04em;background:var(--cream);color:var(--black);text-decoration:none;line-height:1;white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s}
.nav a:hover{background:var(--red);color:var(--white);transform:translateY(-3px) rotate(-1.5deg)}
.nav a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.hero-body{position:absolute;left:max(16px,env(safe-area-inset-left,0px),calc(244 / 1512 * 100vw));top:calc(51.73% - 1.3158em);height:2.6316em;font-size:calc(190 * var(--u))}
.dots{position:absolute;left:0;top:0;display:flex;gap:.134em}
.dots i{display:block;width:.2053em;height:.2053em;border-radius:50%;background:var(--red);filter:url(#rough)}
.headline{margin:0;font:400 1em/1 var(--display);letter-spacing:0.0157em;word-spacing:0.1437em;text-transform:uppercase;color:var(--red)}
.headline:focus{outline:none}
.line{position:absolute;left:0;white-space:nowrap}
.l1{top:calc(.6474em - 0.0969em)}
.l2{top:calc(1.9316em - 0.0969em)}
.txt{display:inline-block;filter:url(#rough);-webkit-text-stroke:.016em currentColor}
.sig{position:absolute;right:max(16px,env(safe-area-inset-right,0px),calc(27 * var(--u)));bottom:max(16px,calc(57 * var(--u)));width:max(140px,calc(314 * var(--u)));height:auto}

/* ---------- hero entrance (after the TV switches channel) ---------- */
.pre .mark,.pre .nav a,.pre .dots i,.pre .txt,.pre .sig{visibility:hidden}
.go .dots i{animation:pop .4s cubic-bezier(.3,1.7,.5,1) backwards}
.go .dots i:nth-child(1){animation-delay:.05s}
.go .dots i:nth-child(2){animation-delay:.14s}
.go .dots i:nth-child(3){animation-delay:.23s}
.go .l1 .txt{animation:wipe .6s cubic-bezier(.75,0,.2,1) .32s backwards,rgb .7s steps(4,end) .32s backwards}
.go .l2 .txt{animation:wipe .6s cubic-bezier(.75,0,.2,1) .55s backwards,rgb .7s steps(4,end) .55s backwards}
.go .sig{animation:sign .6s cubic-bezier(.6,0,.3,1) .9s backwards}
.go .mark{animation:drop .45s cubic-bezier(.25,1.4,.5,1) 1s backwards}
.go .nav a{animation:drop .45s cubic-bezier(.25,1.4,.5,1) backwards}
.go .nav a:nth-child(1){animation-delay:1.06s}
.go .nav a:nth-child(2){animation-delay:1.12s}
.go .nav a:nth-child(3){animation-delay:1.18s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(-20% 100% -20% -3%)}to{clip-path:inset(-20% -4% -20% -3%)}}
@keyframes rgb{0%{text-shadow:-.04em 0 rgba(0,170,255,.85),.04em 0 rgba(255,0,90,.85)}50%{text-shadow:.02em 0 rgba(0,170,255,.6),-.02em 0 rgba(255,0,90,.6)}100%{text-shadow:none}}
@keyframes sign{from{clip-path:inset(-10% 100% -10% -2%)}to{clip-path:inset(-10% -2% -10% -2%)}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

@media (max-width:639px){
  .mark{width:72px;top:16px}
  .nav{top:21px;right:max(16px,env(safe-area-inset-right,0px));gap:6px;font-size:18px}
  .nav a{min-width:0;height:36px;padding:0 .55em .04em}
  .hero-body{left:max(16px,env(safe-area-inset-left,0px));font-size:min(calc((100vw - 32px) / 5.5790),19.3vh)}
  .sig{width:160px;right:max(16px,env(safe-area-inset-right,0px));bottom:24px}
}
@media (prefers-reduced-motion:reduce){
  .roll,.cue.on,.go *{animation:none!important}
  .mark,.nav a{transition:none}
}
</style>
<script>document.documentElement.classList.add('js','intro-on','pre')</script>

<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap id="roughMap" in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="intro" id="intro">
  <div class="screen off" id="screen">
    <canvas id="tv" aria-hidden="true"></canvas>
    <div class="roll" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <div class="vig" aria-hidden="true"></div>
    <div class="osd ch" id="ch" aria-hidden="true">CH 22</div>
    <button class="enter" id="enter" type="button" aria-label="SONDR Rules The World. Enter the site">
      <span class="osd cue" id="cue">CLICK TO TUNE IN</span>
    </button>

<script>
/*
  TV intro reference
  Flow: boot → warming (0.3s of empty landing) → intro (warm-up, static, patch forms, glint) → idle (waits)
        → leave (static burst → CRT collapses to a line → white line opens into the hero) → done (hero).
  The top-left logo replays it: the hero collapses like a CRT, then a short opener (SHORT timeline) runs.
  Esc skips to the hero. ?skip=1 or #hero opens on the hero. Reduced motion: no TV effects, 200ms crossfades.
*/
(() => {
  const D = document, root = D.documentElement, $ = id => D.getElementById(id);
  const intro = $('intro'), screen = $('screen'), cv = $('tv'), enterBtn = $('enter'), flash = $('flash'),
        chEl = $('ch'), cue = $('cue'), site = $('site'), logo = $('patch'), headline = $('headline'),
        roughMap = $('roughMap'), mark = $('mark');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const ctx = cv.getContext('2d');
  const BASE = getComputedStyle(root).getPropertyValue('--landing').trim() || '#1E1E1E';
  const STATIC_TINT = '#ff4a3a';   // multiplies the grey snow inside the patch so it reads red (TV effect only)

  // Opener timeline in ms, counted from the moment the static fills the screen.
  // A snow · P red snow in the patch · E white snow in the embroidery · L the real patch · N snow over the patch
  // S RGB split · SL glitch slices · SW glint sweep
  const FULL = { ch: 150, P: [750, 1250, 1900, 2450], E: [950, 1450, 1850, 2350], A: [1750, 2350], L: [1600, 2350],
                 N: [1650, 2600], S: [1600, 2500], SL: [1650, 2300], SW: [2500, 3300], cue: 2750, idle: 3300 };
  const squeeze = (tl, off, k) => { const o = {}; for (const key in tl) { const v = tl[key]; o[key] = Array.isArray(v) ? v.map(x => Math.max(0, (x - off) * k)) : Math.max(0, (v - off) * k); } return o; };
  const SHORT = squeeze(FULL, 600, 0.42);   // replay from the header logo: about 1.1s, no blank beat or warm-up

  let state = 'boot', ready = false, TL = FULL, W = 0, H = 0, dpr = 1, lx = 0, ly = 0, lw = 0, lh = 0;
  let NW = 0, NH = 0, noise = [], tmp = null, tx = null, emblem = null, sil = null, chans = null, patchS = null, emblemS = null;
  let t0 = 0, leaveT = 0, raf = 0, hover = false, nextGlitch = 0, glitchUntil = 0, chOn = false, cueOn = false, rt = 0, ac = null;
  const NF = 6, PAD = 48;

  const mk = (w, h) => { const c = D.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const eo = x => 1 - (1 - x) * (1 - x) * (1 - x);
  const active = () => /^(warming|intro|idle|still)$/.test(state);
  const focusEnter = () => { try { enterBtn.focus({ preventScroll: true }); } catch (e) {} };

  // Edge roughness scales with the headline size.
  function layoutHero() {
    const fs = parseFloat(getComputedStyle(headline).fontSize) || 100;
    roughMap.setAttribute('scale', clamp(fs * 0.034, 2.5, 7.5).toFixed(2));
  }
  layoutHero();
  if (D.fonts && D.fonts.ready) D.fonts.ready.then(layoutHero);

  function finish(quiet) {
    state = 'done';
    cancelAnimationFrame(raf); raf = 0;
    intro.getAnimations().forEach(a => a.cancel());
    intro.hidden = true; intro.classList.remove('behind');
    root.classList.remove('intro-on', 'pre');
    if (!quiet && !reduce) root.classList.add('go');
    site.inert = false; site.style.visibility = '';
    layoutHero();
    if (!quiet) { try { headline.focus({ preventScroll: true }); } catch (e) {} }
  }

  addEventListener('resize', () => {
    layoutHero();
    if (!ready || state === 'done') return;
    clearTimeout(rt);
    rt = setTimeout(() => { if (state === 'done') return; size(); if (state === 'still') drawStill(); }, 120);
  });

  const skipped = /(^|&)skip=1(&|$)/.test(location.search.slice(1)) || location.hash === '#hero';
  if (skipped) finish(true); else site.inert = true;
  if (touch) cue.textContent = 'TAP TO TUNE IN';

  /* ---------- canvas layers ---------- */
  function layers() {
    const s = Math.min(1, 1200 / logo.naturalWidth);
    const w = Math.round(logo.naturalWidth * s), h = Math.round(logo.naturalHeight * s);
    const base = mk(w, h), bx = base.getContext('2d');
    bx.drawImage(logo, 0, 0, w, h);
    emblem = mk(w, h);   // white embroidery only: the part that forms out of the static first
    const img = bx.getImageData(0, 0, w, h), d = img.data;
    for (let p = 0; p < d.length; p += 4) {
      const m = Math.min(d[p], d[p + 1], d[p + 2]);
      d[p + 3] = d[p + 3] * clamp((m - 120) / 80);
      d[p] = d[p + 1] = d[p + 2] = 255;
    }
    emblem.getContext('2d').putImageData(img, 0, 0);
    sil = mk(w, h);      // black silhouette + one canvas per colour channel, for RGB-split glitches
    const sx = sil.getContext('2d');
    sx.drawImage(base, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = '#000'; sx.fillRect(0, 0, w, h);
    chans = ['#f00', '#0f0', '#00f'].map(col => {
      const c = mk(w, h), x = c.getContext('2d');
      x.drawImage(base, 0, 0);
      x.globalCompositeOperation = 'multiply'; x.fillStyle = col; x.fillRect(0, 0, w, h);
      x.globalCompositeOperation = 'destination-in'; x.drawImage(base, 0, 0);
      return c;
    });
  }

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ar = logo.naturalWidth / logo.naturalHeight;
    lw = Math.min(W * 0.9, H * 0.74 * ar); lh = lw / ar;     // patch: 90% of width or 74% of height
    lx = (W - lw) / 2; ly = (H - lh) / 2 - H * 0.012;
    const g = Math.max(2, Math.round(W / 800));
    const nw = Math.ceil(W / g), nh = Math.ceil(H / g);
    if (nw !== NW || nh !== NH || !noise.length) { NW = nw; NH = nh; makeNoise(); }
    tmp = mk(lw / 2, lh / 2); tx = tmp.getContext('2d');
    patchS = mk(tmp.width, tmp.height); patchS.getContext('2d').drawImage(logo, 0, 0, tmp.width, tmp.height);
    emblemS = mk(tmp.width, tmp.height); emblemS.getContext('2d').drawImage(emblem, 0, 0, tmp.width, tmp.height);
  }

  // Pre-baked frames of analog snow: 2px grain, a little horizontal smear, per-line gain.
  function makeNoise() {
    noise = [];
    const w = NW + PAD, h = NH + PAD;
    for (let f = 0; f < NF; f++) {
      const c = mk(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
      let p = 0;
      for (let y = 0; y < h; y++) {
        const row = 0.72 + Math.random() * 0.42;
        let prev = Math.random() * 255;
        for (let i = 0; i < w; i++, p += 4) {
          let v = Math.random() * 255 * 0.68 + prev * 0.32;
          prev = v;
          v = ((v - 128) * 1.45 + 128) * row;
          d[p] = d[p + 1] = d[p + 2] = v;
          d[p + 3] = 255;
        }
      }
      x.putImageData(img, 0, 0);
      noise.push(c);
    }
  }

  const pick = () => noise[(Math.random() * NF) | 0];
  const jit = () => (Math.random() * PAD) | 0;

  function clearTube() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = BASE; ctx.fillRect(0, 0, W, H);
  }

  function drawNoise(a) {
    ctx.globalAlpha = a; ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pick(), jit(), jit(), NW, NH, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function maskedNoise(mask, a, mode, tint) {
    const tw = tmp.width, th = tmp.height;
    tx.globalCompositeOperation = 'source-over'; tx.globalAlpha = 1; tx.imageSmoothingEnabled = false;
    tx.drawImage(pick(), jit() + lx / W * NW, jit() + ly / H * NH, lw / W * NW, lh / H * NH, 0, 0, tw, th);
    if (tint) { tx.globalCompositeOperation = 'multiply'; tx.fillStyle = tint; tx.fillRect(0, 0, tw, th); }
    tx.globalCompositeOperation = 'destination-in'; tx.drawImage(mask, 0, 0);
    tx.globalCompositeOperation = 'source-over';
    ctx.globalCompositeOperation = mode; ctx.globalAlpha = a; ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, lx, ly, lw, lh);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  function drawLogo(a, s, slices) {
    ctx.globalAlpha = a; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    if (slices) {
      const nw = logo.naturalWidth, nh = logo.naturalHeight, n = 4 + ((Math.random() * 7) | 0);
      let y = 0;
      for (let i = 0; i < n && y < nh; i++) {
        const hh = i === n - 1 ? nh - y : Math.min(nh - y, Math.max(6, (Math.random() * 2 * nh / n) | 0));
        const off = Math.random() < 0.55 ? (Math.random() - 0.5) * lw * 0.07 : 0;
        ctx.drawImage(logo, 0, y, nw, hh, lx + off, ly + y / nh * lh, lw, hh / nh * lh);
        y += hh;
      }
    } else if (s < 0.5) {
      ctx.drawImage(logo, lx, ly, lw, lh);
    } else {
      ctx.drawImage(sil, lx, ly, lw, lh);
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(chans[0], lx - s, ly, lw, lh);
      ctx.drawImage(chans[1], lx, ly, lw, lh);
      ctx.drawImage(chans[2], lx + s, ly + s * 0.25, lw, lh);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  }

  // The glint that runs across the patch once it has resolved.
  function sweep(p) {
    const tw = tmp.width, th = tmp.height;
    tx.globalCompositeOperation = 'source-over'; tx.globalAlpha = 1;
    tx.clearRect(0, 0, tw, th);
    const c = -0.25 + p * 1.5, g = tx.createLinearGradient(0, 0, tw, th * 0.6);
    g.addColorStop(clamp(c - 0.14), 'rgba(255,255,255,0)');
    g.addColorStop(clamp(c), 'rgba(255,255,255,0.5)');
    g.addColorStop(clamp(c + 0.14), 'rgba(255,255,255,0)');
    tx.fillStyle = g; tx.fillRect(0, 0, tw, th);
    tx.globalCompositeOperation = 'destination-in'; tx.imageSmoothingEnabled = true; tx.drawImage(patchS, 0, 0);
    tx.globalCompositeOperation = 'source-over';
    ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
    ctx.drawImage(tmp, lx, ly, lw, lh);
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStill() { clearTube(); drawLogo(1, 0, false); }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    clearTube();
    let A = 0, P = 0, E = 0, L = 0, N = 0, s = 0, sl = false, sw = -1, fl = 0;
    if (state === 'intro') {
      const T = TL, t = now - t0;
      A = 1 - eo(ramp(t, T.A[0], T.A[1]));
      P = eo(ramp(t, T.P[0], T.P[1])) * (1 - ramp(t, T.P[2], T.P[3]));
      E = 0.9 * eo(ramp(t, T.E[0], T.E[1])) * (1 - ramp(t, T.E[2], T.E[3]));
      L = eo(ramp(t, T.L[0], T.L[1]));
      N = 0.85 * (1 - eo(ramp(t, T.N[0], T.N[1])));
      s = 16 * (1 - eo(ramp(t, T.S[0], T.S[1]))) * (0.5 + Math.random());
      sl = t > T.SL[0] && t < T.SL[1] && Math.random() < 0.22;
      if (t > T.SW[0] && t < T.SW[1]) sw = (t - T.SW[0]) / (T.SW[1] - T.SW[0]);
      if (t > T.ch && !chOn) { chOn = true; chEl.classList.add('on'); }
      if (t > T.cue && !cueOn) { cueOn = true; cue.classList.add('on'); }
      if (t > T.idle) { state = 'idle'; nextGlitch = now + 2400; }
    } else if (state === 'idle') {
      A = hover ? 0.09 : 0.035; L = 1;
      N = hover ? 0.08 + Math.random() * 0.12 : 0.025;
      s = hover ? 2 + Math.random() * 5 : 0;
      sl = hover && Math.random() < 0.08;
      fl = Math.random() * 0.05;
      if (now > nextGlitch) { glitchUntil = now + 120; nextGlitch = now + 2600 + Math.random() * 3400; }
      if (now < glitchUntil) { s = Math.max(s, 6); sl = Math.random() < 0.6; N = Math.max(N, 0.2); }
    } else if (state === 'leave') {
      const t = now - leaveT;
      A = eo(ramp(t, 0, 200)); L = 1;
      N = 0.25 + 0.65 * ramp(t, 0, 220);
      s = 6 + 22 * Math.random() * ramp(t, 0, 200);
      sl = Math.random() < 0.55;
    } else {
      return;
    }
    if (A > 0.004) drawNoise(A);
    if (P > 0.004) maskedNoise(patchS, P, 'source-over', STATIC_TINT);
    if (E > 0.004) maskedNoise(emblemS, E, 'lighter');
    if (L > 0.004) drawLogo(L, s, sl);
    if (N > 0.004 && L > 0.004) maskedNoise(patchS, N * L, 'source-over');
    if (sw >= 0) sweep(sw);
    if (fl > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fl.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- sound: a burst of static and a CRT thunk, only after a click, tap or key ---------- */
  function staticSound() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = ac || new AC(); if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime, sr = ac.sampleRate, len = Math.floor(sr * 0.7);
      const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      g.gain.setValueAtTime(0.07, t + 0.22);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      src.connect(hp); hp.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + 0.7);
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t + 0.22); o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
      og.gain.setValueAtTime(0.0001, t + 0.21); og.gain.exponentialRampToValueAtTime(0.1, t + 0.24); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(og); og.connect(ac.destination); o.start(t + 0.2); o.stop(t + 0.6);
    } catch (e) {}
  }

  /* ---------- landing → hero: static burst → CRT collapses to a line → the line opens into the white hero ---------- */
  function tuneIn() {
    if (!active()) return;
    if (!ready) { finish(false); return; }
    if (reduce) {
      state = 'leave'; root.classList.remove('pre'); site.style.visibility = '';
      intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }).onfinish = () => finish(false);
      return;
    }
    state = 'leave'; leaveT = performance.now(); hover = false;
    screen.classList.remove('off');
    if (!raf) raf = requestAnimationFrame(frame);
    chEl.classList.remove('on'); cue.classList.remove('on');
    staticSound();
    setTimeout(() => {
      screen.animate([
        { transform: 'scale(1,1)', filter: 'brightness(1)' },
        { transform: 'scale(1,.006)', filter: 'brightness(3)', offset: 0.75 },
        { transform: 'scale(.9,.003)', filter: 'brightness(6)' }
      ], { duration: 300, easing: 'cubic-bezier(.55,0,.85,.35)', fill: 'forwards' });
    }, 220);
    setTimeout(() => {
      screen.style.visibility = 'hidden';
      flash.animate([
        { transform: 'scale(.9,.003)' },
        { transform: 'scale(1,.004)', offset: 0.25 },
        { transform: 'scale(1,1)' }
      ], { duration: 420, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'forwards' });
    }, 520);
    setTimeout(() => finish(false), 960);
  }

  /* ---------- hero → landing: the header logo. The hero switches off like a CRT, then the short opener runs ---------- */
  function replay() {
    if (state !== 'done' || !ready) return;
    state = 'returning'; hover = false;
    root.classList.remove('go');
    [screen, flash, intro].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    screen.style.visibility = ''; screen.classList.remove('off');
    chEl.classList.remove('on'); cue.classList.remove('on'); chOn = cueOn = false;
    size(); clearTube();
    if (reduce) {
      root.classList.add('intro-on', 'pre'); site.inert = true;
      intro.hidden = false;
      intro.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
      state = 'still'; drawStill(); chEl.classList.add('on'); cue.classList.add('on');
      focusEnter();
      return;
    }
    intro.classList.add('behind'); intro.hidden = false; site.classList.add('front');
    const a = site.animate([
      { transform: 'scale(1,1)' },
      { transform: 'scale(1,.006)', offset: 0.75 },
      { transform: 'scale(.9,.003)' }
    ], { duration: 300, easing: 'cubic-bezier(.55,0,.85,.35)', fill: 'forwards' });
    a.onfinish = () => {
      site.style.visibility = 'hidden';
      a.cancel();
      site.classList.remove('front'); intro.classList.remove('behind');
      root.classList.add('intro-on', 'pre'); site.inert = true;
      TL = SHORT; state = 'intro'; t0 = performance.now();
      if (!raf) raf = requestAnimationFrame(frame);
      focusEnter();
    };
  }

  /* ---------- first load ---------- */
  function init() {
    if (ready) return;
    if (!logo.naturalWidth) { if (state !== 'done') finish(true); return; }
    layers(); size(); ready = true;
    if (state !== 'boot') return;   // opened on the hero
    if (reduce) { state = 'still'; screen.classList.remove('off'); drawStill(); chEl.classList.add('on'); cue.classList.add('on'); return; }
    state = 'warming';              // 0.3s of empty landing background
    setTimeout(() => {
      if (state !== 'warming') return;
      state = 'intro'; TL = FULL; t0 = performance.now() + 260;
      screen.classList.remove('off');
      screen.animate([                // the tube warms up: dot → line → full picture
        { transform: 'scale(.02,.004)', filter: 'brightness(7)' },
        { transform: 'scale(1,.004)', filter: 'brightness(5)', offset: 0.38 },
        { transform: 'scale(1,1)', filter: 'brightness(1)' }
      ], { duration: 600, easing: 'cubic-bezier(.3,.7,.25,1)' });
      raf = requestAnimationFrame(frame);
    }, 300);
  }

  intro.addEventListener('pointermove', e => {
    hover = state === 'idle' && e.pointerType === 'mouse' && e.clientX > lx && e.clientX < lx + lw && e.clientY > ly && e.clientY < ly + lh;
  });
  intro.addEventListener('pointerleave', () => { hover = false; });
  enterBtn.addEventListener('click', tuneIn);
  mark.addEventListener('click', replay);
  D.addEventListener('keydown', e => {
    if (!active()) return;
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tuneIn(); }
  });

  const decoded = logo.decode ? logo.decode().catch(() => {}) : Promise.resolve();
  decoded.then(() => (D.fonts && D.fonts.ready) || null).then(init, init);
})();
</script>
